<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
    <title>Mafia Wars/title>
    <link rel="stylesheet" href="style.css?v=4.0">
</head>
<body class="day">

<div id="screenJoin" class="screen">
    <div class="joinCard">
        <h1>Mafia Wars</h1>
        <h2>By Dr Shaggyyy</h2>
        <input type="text" id="playerName" placeholder="Enter your name" />
        <div class="joinBtns">
            <button id="joinHostBtn">Join as Host</button>
            <button id="joinPlayerBtn">Join as Player</button>
        </div>
    </div>
</div>

<div id="screenGame" class="screen hidden">

    <div class="topBar">
        <div class="hostSection">
            <h2 id="hostStatus">Waiting...</h2>
            <div id="hostCard" class="hostCard">
                <h3 id="hostName">Host</h3>
            </div>
        </div>

        <div id="hostControls" class="hidden">
            <div class="btnGroup">
                <button id="shuffleBtn">🔀 Shuffle</button>
                <button id="dealBtn" disabled>🃏 Deal</button>
                <button id="nightBtn">🌙 Night</button>
                <button id="dayBtn">☀️ Day</button>
                <button id="endVoteBtn" class="hidden">⚖️ End Vote</button>
                <button id="resetBtn" style="background:#f44336">🔄 Reset</button>
            </div>
            <div id="hostFeed" class="hostFeed hidden">
                <h4>📡 Live Monitor</h4>
                <ul id="liveVoteList"></ul>
            </div>
        </div>
    </div>

    <div id="tableArea" class="tableArea">
        <div id="centralDeck" class="deckWrapper">
            <div class="cardDeck">
                <img src="images/back.png" class="deckImg">
                <img src="images/back.png" class="deckImg layer1">
                <img src="images/back.png" class="deckImg layer2">
            </div>
            <p id="deckStatus">Tap to Shuffle</p>
        </div>
    </div>

    <div class="gameContainer">
        <div id="playersList" class="players"></div>

        <div class="rightPanel">
            <div id="phaseBanner" class="phaseBanner">Phase: <span id="phaseText">Day</span></div>

            <div id="actionPanel" class="panel hidden">
                <h3>Night Action</h3>
                <p id="actionInstruction">Select a target...</p>
                <div id="actionTargets" class="targets"></div>
                <button id="submitActionBtn" class="primary" disabled>Submit Action</button>
            </div>

            <div id="votingPanel" class="panel hidden">
                <h3>Day Vote</h3>
                <p id="voteInstruction">Who do you want to eliminate?</p>
                <div id="voteTargets" class="targets"></div>
                <button id="submitVoteBtn" class="primary" disabled>Submit Vote</button>
            </div>

            <div class="panel">
                <h4>Game Log</h4>
                <ul id="gameLog" class="log"></ul>
            </div>
        </div>
    </div>

    <button id="exitBtn" class="exitBtn">Exit Game</button>
</div>

<div id="roleModal">
    <div class="modalContent">
        <h2 id="modalName">Player Name</h2>
        <img id="modalRole" src="" alt="Role Card" />
        <p id="modalRoleText"></p>
        <button class="closeModal" onclick="closeModal()">Close</button>
    </div>
</div>

<script type="module" src="main.js?v=4.0"></script>
</body>
</html>
