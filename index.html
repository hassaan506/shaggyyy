<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mafia Wars Online</title>
<link rel="stylesheet" href="style.css?v=1.5">
</head>
<body class="dark">

<!-- JOIN SCREEN -->
<div id="screenJoin" class="screen">
    <div class="joinCard">
        <h1>Mafia Wars Online</h1>
        <input type="text" id="playerName" placeholder="Enter your name">
        <div class="joinBtns">
            <button id="joinHostBtn">Join as Host</button>
            <button id="joinPlayerBtn">Join as Player</button>
        </div>
    </div>
</div>

<!-- GAME SCREEN -->
<div id="screenGame" class="screen hidden">
    <div class="topBar">
        <h2 id="hostStatus">Waiting for host...</h2>
        <div id="hostControls" class="hidden">
            <button id="dealBtn">Deal Roles</button>
            <button id="shuffleBtn">Shuffle</button>
            <button id="resetBtn">Reset</button>
            <button id="nightBtn">Night Phase</button>
            <button id="dayBtn">Day Phase</button>
        </div>
    </div>

    <!-- Host seat on top -->
    <div id="hostSeat" class="playerSeat">
        <h3>Host</h3>
        <div id="hostName"></div>
    </div>

    <!-- Player seats -->
    <div id="playersList" class="players"></div>

    <button id="exitBtn" class="exitBtn">Exit Game</button>
</div>

<!-- ROLE MODAL -->
<div id="roleModal">
    <div class="modalContent">
        <h2 id="modalName">Player Name</h2>
        <img id="modalRole" src="" alt="Role Card">
        <button class="closeModal" onclick="closeModal()">Close</button>
    </div>
</div>

<script type="module" src="main.js?v=1.5"></script>
</body>
</html>
