<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mafia Wars Online</title>
<link rel="stylesheet" href="style.css?v=3">
</head>

<body class="dark">

<!-- JOIN SCREEN -->
<div id="screenJoin" class="screen">
    <div class="joinCard">
        <h1>Mafia Wars Online</h1>
        <input type="text" id="playerName" placeholder="Enter your name">
        <div class="joinBtns">
            <button id="joinHostBtn">Join as Host</button>
            <button id="joinPlayerBtn">Join as Player</button>
        </div>
    </div>
</div>

<!-- GAME SCREEN -->
<div id="screenGame" class="screen hidden">

    <!-- HOST AREA (always top and separate) -->
    <div class="hostArea">
        <h2 id="hostStatus">Waiting for host...</h2>
        <div id="hostControls" class="hidden">
            <button id="dealBtn">Deal Roles</button>
            <button id="shuffleBtn">Shuffle</button>
            <button id="resetBtn">Reset</button>
            <button id="nightBtn">Night</button>
            <button id="dayBtn">Day</button>
        </div>
    </div>

    <!-- PLAYER GRID -->
    <div id="playersList" class="playersGrid"></div>

    <button id="exitBtn" class="exitBtn">Exit Game</button>
</div>

<!-- ROLE MODAL -->
<div id="roleModal">
    <div class="modalContent">
        <h2 id="modalName"></h2>
        <img id="modalRole" src="">
        <button class="closeModal" onclick="closeModal()">Close</button>
    </div>
</div>

<script type="module" src="main.js?v=3"></script>
</body>
</html>
